name: Validate registry

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - name: Enforce immutable releases and verify new packages
        if: github.event_name == 'pull_request'
        run: npm run verify:changed
      - run: npm run generate
      - name: Require committed registry output
        run: git diff --exit-code
