name: Validate registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - name: Enforce immutable releases and verify new packages
        if: github.event_name == 'pull_request'
        run: npm run verify:changed
      - run: npm run generate
      - name: Verify published registry when source and registry already match
        shell: bash
        run: |
          if git diff --quiet -- registry/catalog.v1.json registry/extensions; then
            npm run registry:verify
          else
            echo "Registry publication is pending maintainer signing approval."
          fi
