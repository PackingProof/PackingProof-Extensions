name: Sync main to Gitee

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refuse to mirror an unsigned registry
        run: npm run registry:verify
      - name: Push the same main branch to Gitee
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_USERNAME" ] || [ -z "$GITEE_TOKEN" ]; then
            echo "::error title=Gitee credentials missing::GITEE_USERNAME and GITEE_TOKEN must be configured"
            exit 1
          fi
          basic_auth="$(printf '%s:%s' "$GITEE_USERNAME" "$GITEE_TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraHeader=Authorization: Basic $basic_auth" \
            push "https://gitee.com/PackingProof/PackingProof-Extensions.git" main:main
